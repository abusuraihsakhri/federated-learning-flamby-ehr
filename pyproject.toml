[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-learning-flamby-ehr"
version = "2.0.0"
description = "FedEHR: Federated Averaging (FedAvg) & Secure Aggregation Healthcare Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "numpy>=1.24,<3",
]

[project.scripts]
federated-learning-flamby-ehr = "federated_learning_ehr.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/federated-learning-flamby-ehr"
Repository = "https://github.com/abusuraihsakhri/federated-learning-flamby-ehr.git"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
py-modules = ["cli", "simulator", "enrichment", "federated_learning_ehr_app"]

[tool.setuptools.packages.find]
include = ["agents*", "federated_learning_ehr*", "web*"]

[tool.setuptools.package-data]
web = ["*.html"]
