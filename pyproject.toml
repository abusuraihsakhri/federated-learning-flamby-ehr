[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-learning-flamby-ehr"
version = "2.0.0"
description = "FedEHR: Federated Averaging (FedAvg) & Secure Aggregation Healthcare Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
federated-learning-flamby-ehr = "federated_learning_ehr.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/federated-learning-flamby-ehr"
Repository = "https://github.com/abusuraihsakhri/federated-learning-flamby-ehr.git"

[tool.pytest.ini_options]
testpaths = ["tests"]
