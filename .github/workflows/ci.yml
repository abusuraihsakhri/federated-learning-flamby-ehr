name: Federated Learning Flamby Ehr CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
        pip install ruff

    - name: Run Pytest Suite
      env:
        AUDIT_SECRET_KEY: ci-test-audit-secret-key-for-github-actions-2026
      run: |
        python -m compileall -q agents federated_learning_ehr cli.py simulator.py enrichment.py
        pytest -v

    - name: Check Python syntax and undefined names
      run: ruff check --select E4,E7,E9,F63,F7,F82 --ignore E402 .

    - name: Security SAST & Zero-PHI Audit
      env:
        AUDIT_SECRET_KEY: ci-test-audit-secret-key-for-github-actions-2026
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
